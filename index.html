<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131625">
<meta name="color-scheme" content="dark">
<title>温哥华 8/22–8/29 · 行程</title>
<meta name="description" content="2026-08-22 至 08-29 温哥华 + 温哥华岛，7 人 3 房 2 车。旅途中手机随身查。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">

<style>
:root{
  --bg:oklch(.15 .02 268);
  --surface:oklch(.195 .025 268);
  --surface-2:oklch(.245 .03 268);
  --line:oklch(1 0 0 / .09);
  --line-2:oklch(1 0 0 / .16);
  --ink:oklch(.96 .008 268);
  --ink-2:oklch(.84 .015 268);
  --muted:oklch(.72 .018 268);
  --primary:oklch(.72 .13 268);
  --primary-dim:oklch(.72 .13 268 / .18);
  --alert:oklch(.74 .17 25);
  --alert-dim:oklch(.74 .17 25 / .15);
  --warn:oklch(.84 .13 78);
  --warn-dim:oklch(.84 .13 78 / .14);
  --ok:oklch(.78 .14 158);
  --ok-dim:oklch(.78 .14 158 / .14);
  --r:12px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --tabh:calc(58px + env(safe-area-inset-bottom));
  --z-head:20; --z-tabs:30;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;
  padding-bottom:var(--tabh);
  overscroll-behavior-y:none;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--primary);text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.hd{
  position:sticky;top:0;z-index:var(--z-head);
  background:oklch(.15 .02 268 / .93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 0;
}
.hd-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:10px}
.hd-t{font-size:15px;font-weight:700;letter-spacing:.01em}
.hd-t span{color:var(--muted);font-weight:500}
.hd-clock{font-size:12.5px;color:var(--muted);white-space:nowrap}
.hd-clock b{color:var(--warn);font-weight:600}

/* ---------- day rail ---------- */
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 0 9px;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.rail button{
  flex:0 0 auto;scroll-snap-align:center;
  min-width:52px;padding:6px 9px 7px;border-radius:10px;
  background:var(--surface);border:1px solid transparent;
  display:grid;gap:1px;text-align:center;transition:background .15s,border-color .15s;
}
.rail button:hover{background:var(--surface-2)}
.rail .d{font-size:16px;font-weight:700;line-height:1.15}
.rail .w{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.rail button[aria-selected=true]{background:var(--primary-dim);border-color:var(--primary)}
.rail button[aria-selected=true] .w{color:var(--ink-2)}
.rail button[data-today="1"] .d::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--warn);margin:2px auto -2px}

/* ---------- panels ---------- */
main{padding:14px 14px 28px;max-width:760px;margin-inline:auto}
.panel[hidden]{display:none}
.dhead{margin-bottom:12px}
.dhead h2{font-size:19px;font-weight:700;letter-spacing:.01em;line-height:1.3;text-wrap:balance}
.dhead p{font-size:13px;color:var(--muted);margin-top:3px}

/* ---------- timeline ---------- */
.tl{display:grid;gap:2px}
.ev{
  display:grid;grid-template-columns:58px 1fr;gap:10px;
  padding:9px 10px 9px 0;border-radius:8px;
  border-top:1px solid var(--line);
}
.ev:first-child{border-top:0}
.ev-t{font-size:12.5px;color:var(--muted);padding-top:2px;letter-spacing:-.01em}
.ev-b{min-width:0}
.ev-h{font-size:15px;font-weight:600;line-height:1.4;text-wrap:pretty}
.ev-m{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.ev-m b{color:var(--ink-2);font-weight:600}

.ev.k-hard{background:var(--alert-dim);padding-left:10px;border-top-color:transparent;margin-top:2px}
.ev.k-hard .ev-t{color:var(--alert)}
.ev.k-hard .ev-h::before{content:"必做";font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--alert);margin-right:7px;vertical-align:1.5px}
.ev.k-move{background:oklch(1 0 0/.03);padding-left:10px;border-top-color:transparent;margin-top:2px}
.ev.k-move .ev-t{color:var(--primary)}
.ev.k-star .ev-h{color:var(--warn)}
.ev.k-free .ev-h::after{content:"免费";font-size:10.5px;font-weight:700;color:var(--ok);background:var(--ok-dim);padding:1px 5px;border-radius:5px;margin-left:7px;vertical-align:1.5px}
.ev.k-work{background:oklch(1 0 0/.03);padding-left:10px;border-top-color:transparent;margin-top:2px}
.ev.k-work .ev-t{color:var(--ink-2)}

/* split day */
.split{display:grid;gap:9px;margin-top:2px}
@media(min-width:620px){.split{grid-template-columns:1fr 1fr;align-items:start}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}
.col h3{font-size:13px;font-weight:700;margin-bottom:7px;letter-spacing:.02em}
.col .ev{grid-template-columns:48px 1fr;padding:7px 0}
.col .ev-h{font-size:14px}

/* ---------- notes ---------- */
details.note{margin-top:9px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
details.note>summary{
  list-style:none;cursor:pointer;padding:11px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
details.note>summary::-webkit-details-marker{display:none}
details.note>summary::after{content:"+";color:var(--muted);font-size:17px;line-height:1;transition:transform .2s var(--ease)}
details.note[open]>summary::after{transform:rotate(45deg)}
details.note[open]>summary{color:var(--ink)}
details.note .body{padding:0 12px 12px;font-size:13.5px;color:var(--ink-2);line-height:1.65}
details.note .body p+p{margin-top:8px}
details.note .body b{color:var(--ink)}

/* ---------- blocks ---------- */
.sec{margin-bottom:22px}
.sec>h2{font-size:17px;font-weight:700;margin-bottom:3px;letter-spacing:.01em}
.sec>.sub{font-size:13px;color:var(--muted);margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.card+.card{margin-top:9px}
.card h3{font-size:15.5px;font-weight:700;line-height:1.35}
.card .when{font-size:12.5px;color:var(--warn);font-weight:600;margin-bottom:3px;letter-spacing:.02em}
.card .addr{font-size:13px;color:var(--muted);margin-top:4px;display:block}
.rooms{display:grid;gap:6px;margin-top:10px}
.room{display:grid;grid-template-columns:32px 1fr auto;gap:9px;align-items:baseline;font-size:13.5px;padding:7px 9px;background:oklch(1 0 0/.035);border-radius:8px}
.room .tag{font-size:11.5px;font-weight:700;color:var(--primary);letter-spacing:.03em}
.room .who{color:var(--ink-2);min-width:0}
.room .pay{font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right}
.room .pay.pts{color:var(--ok);font-weight:600}
.acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.acts a{
  font-size:13px;font-weight:600;padding:8px 13px;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);
  transition:background .15s;
}
.acts a:hover{background:oklch(1 0 0/.1)}

.al{border:1px solid;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6}
.al+.al{margin-top:8px}
.al b{font-weight:700}
.al.r{background:var(--alert-dim);border-color:oklch(.74 .17 25/.4)}
.al.r>b:first-child{color:var(--alert)}
.al.w{background:var(--warn-dim);border-color:oklch(.84 .13 78/.35)}
.al.w>b:first-child{color:var(--warn)}
.al.g{background:var(--ok-dim);border-color:oklch(.78 .14 158/.35)}
.al.g>b:first-child{color:var(--ok)}
.al .d{margin-top:4px;color:var(--ink-2)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 11px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
tfoot td{font-weight:700;border-top:1px solid var(--line-2)}
td.n{font-variant-numeric:tabular-nums}

.ck{display:grid;gap:7px}
.ck label{
  display:grid;grid-template-columns:22px 1fr;gap:11px;align-items:start;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;cursor:pointer;transition:opacity .2s,background .15s;
}
.ck label:hover{background:var(--surface-2)}
.ck input{
  appearance:none;-webkit-appearance:none;width:20px;height:20px;margin-top:1px;border-radius:6px;
  border:1.5px solid var(--line-2);background:var(--surface-2);cursor:pointer;
  display:grid;place-content:center;transition:background .15s,border-color .15s;
}
.ck input:checked{background:var(--ok);border-color:var(--ok)}
.ck input:checked::after{content:"✓";color:oklch(.2 .04 158);font-size:13px;font-weight:900;line-height:1}
.ck .txt{min-width:0}
.ck .txt b{display:block;font-size:14px;font-weight:600;line-height:1.4}
.ck .txt span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.ck label:has(input:checked){opacity:.45}
.ck label:has(input:checked) .txt b{text-decoration:line-through}
.ck-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.ck-hd h3{font-size:14px;font-weight:700}
.ck-hd .cnt{font-size:12.5px;color:var(--muted)}
.grp{margin-bottom:16px}
.prog{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:2px;transition:width .35s var(--ease)}

/* ---------- bottom tabs ---------- */
.tabs{
  position:fixed;inset:auto 0 0 0;z-index:var(--z-tabs);
  display:grid;grid-template-columns:repeat(5,1fr);
  background:oklch(.16 .022 268 / .96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabs button{
  padding:8px 2px 9px;display:grid;gap:3px;justify-items:center;
  font-size:10.5px;color:var(--muted);letter-spacing:.03em;transition:color .15s;
}
.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs button[aria-selected=true] svg{stroke:var(--primary)}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

 notes:[["为什么落地当天就去布查特","<p><b>8/22 是八月最后几场烟花之一</b>。官网逐场表：8/15 21:15 · <b>8/22 21:15</b> · 8/29 21:00。周六开到 22:00。</p><p>一张票就够 — 烟花和演出对持票人免费。</p><p>⚠️ <b>烟花夜禁止出园再进</b>（官网原文 Readmission is not permitted），所以不能先回酒店休息，只能一口气待到散场。</p>"],["先打电话给 Delta","<p>多伦多组 08:00 起飞 = 太平洋时间 <b>02:30 起床</b>。到酒店时全组已经醒着 21 小时。<b>务必提前告知酒店 23:30 晚抵达。</b></p><p>园内正餐别省。烟花前铺条毯子让弟弟先睡一会。</p>"],["赶不上 14:00 那班船也不慌","<p>下一班 <b>15:00</b> → 16:35 靠岸 → 17:00 进园，<b>烟花照样赶得上</b>。</p>"]]},

 {t:"10:30",k:"free",h:"BC 省议会大楼导览",m:"内港正对面，室内"},

{d:"8/24",w:"一",title:"孔雀、山羊与天空栈道",sub:"她 06:00–14:00 上班 · 上午 6 人 2 车",ev:[

 {t:"09:30",h:"6 人退房"},
 {t:"10:00",h:"Fan Tan Alley + 唐人街牌楼",m:"<b>15 分钟拍照走人</b>，不为唐人街留半天"},
 {t:"10:15",h:"Market Square + Johnson St 老城区",m:"可加 Bug Zoo 30 分钟"},
 {t:"12:15",h:"午餐"},
 {t:"14:00",k:"hard",h:"接女友 + 她退房",m:"<b>她那间必须提前钉死 14:00 延退</b>"},
 {t:"14:15",k:"move",h:"出发 → Swartz Bay",m:"32 km / 35 分钟"},
 {t:"15:00",k:"hard",h:"渡轮 check-in",m:"<b>开船前 60 分钟开、30 分钟关</b>"},

const TRIP=DAYS.map(d=>{const[m,day]=d.d.split('/');return new Date(Date.UTC(2026,+m-1,+day))});
function vanMidnight(){
  const s=new Date().toLocaleDateString('en-CA',{timeZone:'America/Vancouver'});
  const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);
}
function todayIdx(){const t=vanMidnight();return TRIP.findIndex(d=>+d===t)}
function clock(){
  const hm=new Date().toLocaleTimeString('en-GB',{timeZone:'America/Vancouver',hour:'2-digit',minute:'2-digit',hour12:false});
  const i=todayIdx();let lead;
  if(i>=0)lead=`<b>第 ${i+1} 天</b>`;
  else{const n=Math.round((+TRIP[0]-vanMidnight())/864e5);lead=n>0?`<b>还有 ${n} 天</b>`:'行程已结束';}
  $('#clock').innerHTML=`${lead} · 温哥华 <span class="mono">${hm}</span>`;
}
const evHTML=e=>`<div class="ev k-${e.k||'norm'}"><div class="ev-t mono">${esc(e.t)}</div><div class="ev-b"><div class="ev-h">${esc(e.h)}</div>${e.m?`<div class="ev-m">${e.m}</div>`:''}</div></div>`;
const notesHTML=ns=>(ns||[]).map(([t,b])=>`<details class="note"><summary>${esc(t)}</summary><div class="body">${b}</div></details>`).join('');

function renderDay(i){
  const d=DAYS[i];
  const body=d.split
    ?`<div class="split">${d.split.map(c=>`<div class="col"><h3>${esc(c.h)}</h3><div class="tl">${c.ev.map(evHTML).join('')}</div></div>`).join('')}</div>`
    :`<div class="tl">${d.ev.map(evHTML).join('')}</div>`;
  $('#p-day').innerHTML=`<div class="dhead"><h2>${esc(d.d)} ${esc(d.w)} · ${esc(d.title)}</h2><p>${esc(d.sub)}</p></div>${body}${notesHTML(d.notes)}`;
}
function selectDay(i){
  [...$('#rail').children].forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));
  renderDay(i);
  $('#rail').children[i]?.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
function renderRail(){
  const ti=todayIdx();
  $('#rail').innerHTML=DAYS.map((d,i)=>
    `<button type="button" role="tab" aria-selected="false" data-i="${i}"${i===ti?' data-today="1"':''}><span class="d">${d.d.split('/')[1]}</span><span class="w">${d.w}</span></button>`).join('');
  $('#rail').addEventListener('click',e=>{const b=e.target.closest('button');if(b)selectDay(+b.dataset.i)});
}

function renderStay(){
  $('#p-stay').innerHTML=`<div class="sec"><h2>住哪</h2><p class="sub">三段 · 三间房 · 房号 R1 / R2 / R3 全程不变</p>
  ${STAY.map(s=>`<div class="card"><div class="when">${esc(s.when)}</div><h3>${esc(s.n)}</h3><span class="addr">${esc(s.a)}</span>
    <div class="rooms">${s.rooms.map(([t,w,p,c])=>`<div class="room"><span class="tag">${t}</span><span class="who">${esc(w)}</span><span class="pay ${c||''}">${esc(p)}</span></div>`).join('')}</div>
    <div class="acts"><a href="${map(s.a)}" target="_blank" rel="noopener">地图导航</a><a href="tel:${s.tel}">打电话</a></div>
    <div style="margin-top:11px">${s.al.map(([k,t])=>`<div class="al ${k}">${t}</div>`).join('')}</div></div>`).join('')}</div>`;
}

function renderBook(){
  const done=JSON.parse(localStorage.getItem('yvr-book')||'{}');
  let n=0,tot=0;
  const html=BOOK.map((g,gi)=>{
    const items=g.it.map((it,ii)=>{
      const id=`b${gi}-${ii}`;tot++;if(done[id])n++;
      return `<label><input type="checkbox" data-id="${id}"${done[id]?' checked':''}><span class="txt"><b>${esc(it[0])}</b>${it[1]?`<span>${esc(it[1])}</span>`:''}</span></label>`}).join('');
    return `<div class="grp"><div class="ck-hd"><h3>${esc(g.g)}</h3><span class="cnt mono">${g.it.length}</span></div><div class="ck">${items}</div></div>`}).join('');
  $('#p-book').innerHTML=`<div class="sec"><h2>下单顺序</h2><p class="sub">按顺序做 · 勾选状态存在这台手机上</p><div class="prog"><i style="width:${tot?n/tot*100:0}%"></i></div>${html}</div>`;
  $('#p-book').addEventListener('change',e=>{
    const c=e.target;if(c.type!=='checkbox')return;
    const s=JSON.parse(localStorage.getItem('yvr-book')||'{}');
    if(c.checked)s[c.dataset.id]=1;else delete s[c.dataset.id];
    localStorage.setItem('yvr-book',JSON.stringify(s));
    const all=[...$('#p-book').querySelectorAll('input')];
    $('#p-book .prog i').style.width=all.filter(x=>x.checked).length/all.length*100+'%';
  });
}

function renderCost(){
  const f=n=>n.toFixed(2);
  $('#p-cost').innerHTML=`<div class="sec"><h2>钱</h2><p class="sub">七人总 $20,060.56 · 人均 $2,865.79 · 女友一家算到 8/27</p>
  <div class="tw"><table><thead><tr><th>人</th><th>机票</th><th>酒店</th><th>车渡轮</th><th>门票</th><th>餐饮</th><th>合计</th></tr></thead>
  <tbody>${COST.map(r=>`<tr><td>${esc(r[0])}</td>${r.slice(1,6).map(v=>`<td class="n mono">${f(v)}</td>`).join('')}<td class="n mono"><b>${f(r[6])}</b></td></tr>`).join('')}</tbody>
  <tfoot><tr><td>七人总</td><td colspan="5"></td><td class="n mono">20,060.56</td></tr></tfoot></table></div>
  <div style="margin-top:9px" class="al g"><b>积分省下 $3,379.50</b><div class="d">Bonvoy 341,038 分换 6 个 Element 房晚（50,000/晚，<b>1.127¢</b>），剩 41,038 分。<b>一分 MR 都没动。</b></div></div>
  <div class="al w"><b>区间 $2,609.54 到 $3,041.02</b><div class="d">想让全员低于 $3,000：8/28 改订 Sheraton（Dylan → $2,975.72）或 Radisson Blu（→ $2,965.70）。</div></div></div>

  <div class="sec"><h2>门票</h2><p class="sub">含 GST 5%</p>
  <div class="tw"><table><thead><tr><th>项目</th><th>成人</th><th>妹妹 17</th><th>弟弟 7</th></tr></thead>
  <tbody>${TICKET.map(r=>`<tr><td>${esc(r[0])}</td>${r.slice(1).map(v=>`<td class="n mono">${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div style="margin-top:9px" class="al w"><b>Eagle Wing 是最大的单笔未知折扣</b><div class="d">官网写有 senior / youth / child 折扣但不公布金额。打 <b>250-384-8008</b>，七个人可能一次省 $150–300。</div></div></div>

  <div class="sec"><h2>车 · 油 · 渡轮 · 停车</h2><p class="sub">$3,071.50 ÷ 7 = $438.79/人</p>
  <div class="tw"><table><tbody>${CAR.map(([a,b])=>`<tr><td>${esc(a)}</td><td class="n mono">${esc(b)}</td></tr>`).join('')}</tbody></table></div>
  <div style="margin-top:9px" class="al g"><b>加油别在维多利亚</b><div class="d">那边贵 4¢/L。<b>Costco Richmond（Bridgeport Rd）便宜 8–12¢/L</b>，就在 Versante 隔壁那条路，8/29 还车前顺手加满。</div></div></div>`;
}

function renderKey(){
  $('#p-key').innerHTML=`<div class="sec"><h2>要点</h2><p class="sub">出问题最贵的几件事</p>
  ${KEY.map(([k,t,b])=>`<div class="al ${k}"><b>${esc(t)}</b><div class="d">${b}</div></div>`).join('')}</div>
  <div class="sec"><h2>还没确认的</h2><p class="sub">出发前逐条销掉</p>
  <div class="tw"><table><tbody>${OPEN.map(([a,b])=>`<tr><td>${esc(a)}</td><td class="mono" style="color:var(--muted)">${esc(b)}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ============================== TABS ============================== */
const TABS=[
 ["day","行程",'<path d="M3 9h18M8 3v3m8-3v3M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/>'],
 ["stay","住宿",'<path d="M3 21h18M5 21V8l7-5 7 5v13M10 21v-6h4v6"/>'],
 ["book","下单",'<path d="M9 11l3 3 8-8M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/>'],
 ["cost","钱",'<path d="M12 2v20M17 6.5C17 4.6 14.8 3.5 12 3.5S7 4.6 7 6.5s2 2.9 5 3.5 5 1.6 5 3.5-2.2 3-5 3-5-1.1-5-3"/>'],
 ["key","要点",'<circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3.5v.01"/>']
];
$('#tabs').innerHTML=TABS.map(([k,l,ic],i)=>
 `<button type="button" role="tab" data-k="${k}" aria-selected="${i===0}" aria-controls="p-${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg><span>${l}</span></button>`).join('');

const built={day:1},RENDER={stay:renderStay,book:renderBook,cost:renderCost,key:renderKey};
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const k=b.dataset.k;
  [...$('#tabs').children].forEach(x=>x.setAttribute('aria-selected',String(x===b)));
  TABS.forEach(([kk])=>{$('#p-'+kk).hidden=kk!==k});
  $('#rail').style.display=k==='day'?'':'none';
  if(!built[k]){RENDER[k]();built[k]=1}
  window.scrollTo(0,0);
});

/* ============================== BOOT ============================== */
renderRail();
const ti=todayIdx();
selectDay(ti>=0?ti:0);
clock();setInterval(clock,30000);
</script>
